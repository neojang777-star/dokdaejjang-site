name: Blog feed
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update blog list
        run: python3 scripts/blog_feed.py index.html
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "blog-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "블로그 최신 글 갱신"
          git push
